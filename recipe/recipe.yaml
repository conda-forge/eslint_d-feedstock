context:
  version: "15.1.0"

package:
  name: eslint_d
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/eslint_d/-/eslint_d-${{ version }}.tgz
  sha256: f5ade803542ae99899eaf49c68a2678266f32b44cb4a6a828d0029fefadc1ca7

build:
  number: 0
  noarch: generic

requirements:
  build:
    - jq
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - eslint_d --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Speed up eslint to accelerate your development workflow
  homepage: https://github.com/mantoni/eslint_d.js
  repository: https://github.com/mantoni/eslint_d.js

extra:
  recipe-maintainers:
    - danielnachun
